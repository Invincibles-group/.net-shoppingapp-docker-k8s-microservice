apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: shoppingapp-ns
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: order-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: shoppingapp-ns
  labels:
    app: order-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-api
  template:
    metadata:
      labels:
        app: order-api
    spec:
      containers:
      - name: order-api
        image: shopping-microservices-ordering-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
          - name: DB_HOST
            value: "order-service-db"
          - name: POSTGRES_DB
            valueFrom:
              configMapKeyRef:
                name: shoppingapp-config-map
                key: POSTGRES_DB
          - name: POSTGRES_USER
            valueFrom:
              configMapKeyRef:
                name: shoppingapp-config-map
                key: POSTGRES_USER
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: shoppingapp-secret
                key: POSTGRES_PASSWORD